# Android ARM64 APK for review and manual testing.
# Build prerequisites are specified in BUILDING.md; never commit native binaries.
name: ALTIV - Android ARM64 APK

on:
  # Each merge into main should produce an APK containing the merged fixes.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/altiv-android-arm64.yml'
      - 'src/android/**'
      - 'deps/**'
      - 'scripts/prepare_android_sandbox.sh'
      - 'scripts/altiv_release_gate.py'
      - 'scripts/tests/test_altive_photo_search.py'
      - 'scripts/tests/test_altiv_github_edit.py'
      - 'scripts/tests/test_altiv_workspace.py'
  pull_request:
    paths:
      - '.github/workflows/altiv-android-arm64.yml'
      - 'src/android/**'
      - 'deps/**'
      - 'scripts/prepare_android_sandbox.sh'
      - 'scripts/altiv_release_gate.py'
      - 'scripts/tests/test_altive_photo_search.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: altiv-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Compile and verify ARM64 debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout with the native PRoot submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: ALTIVE global quality and integrated release contract preflight
        shell: bash
        run: |
          set -euo pipefail
          # Fail before costly native compilation if a previously agreed
          # commercial feature, security check or regression test disappeared.
          # A green preflight is only a review CANDIDATE, not physical signoff.
          python3 scripts/altiv_release_gate.py --mode candidate

      - name: Validate licensed real-photo search offline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile src/android/app/src/main/assets/default_mount/usr/local/bin/altive-photo-search.py
          python3 -m py_compile src/android/app/src/main/assets/default_mount/usr/local/bin/altive-media-search.py
          python3 -m unittest discover -s scripts/tests -p 'test_altive_photo_search.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_altive_media_search.py' -v

      - name: Validate GitHub binary upload helper
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile src/android/app/src/main/assets/default_mount/usr/local/bin/altiv-github-upload.py
          python3 -m unittest discover -s scripts/tests -p 'test_altiv_github_binary_upload.py' -v

      - name: Validate GitHub exact-text editor
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile src/android/app/src/main/assets/default_mount/usr/local/bin/altiv-github-edit.py
          python3 -m unittest discover -s scripts/tests -p 'test_altiv_github_edit.py' -v

      - name: Validate local GitHub workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile src/android/app/src/main/assets/default_mount/usr/local/bin/altiv-workspace.py
          python3 -m unittest discover -s scripts/tests -p 'test_altiv_workspace.py' -v

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies and diagnostics
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Check KSP plugin repositories (diagnostic only)
        shell: bash
        run: |
          set -euo pipefail
          REL='com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.1.0-1.0.29/com.google.devtools.ksp.gradle.plugin-2.1.0-1.0.29.pom'
          for base in 'https://repo.maven.apache.org/maven2' 'https://plugins.gradle.org/m2'; do
            if curl --location --fail --silent --show-error --connect-timeout 10 --max-time 20 --output /dev/null "$base/$REL"; then
              echo 'ALTIV: KSP plugin marker reachable.'
              exit 0
            fi
          done
          echo '::warning::KSP probe unavailable; Gradle will resolve using configured repositories and cache. Android tests remain mandatory.'

      - name: Configure Go 1.25 for gomobile / rclone
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Configure Android command line SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36, NDK r28c and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358' \
            'cmake;3.22.1'
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          NDK="$SDK_ROOT/ndk/28.2.13676358"
          test -d "$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

      - name: Enable QEMU ARM64 for prebundled Alpine tools
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build Android PRoot from its source; verify preserved Termux loaders
        shell: bash
        run: |
          set -euo pipefail
          ./deps/build_proot.sh
          ./scripts/prepare_android_sandbox.sh

      - name: Build rclone Android library with gomobile
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/rclone.aar
          test -s src/android/app/libs/rclone.aar

      - name: Give Kotlin compilation enough memory on CI
        shell: bash
        run: |
          set -euo pipefail
          # The first CI run failed in compileGithubDebugKotlin with
          # OutOfMemoryError: GC overhead limit exceeded (2 GiB heap).
          # Override the default only in the ephemeral Actions workspace.
          sed -i 's/^org[.]gradle[.]jvmargs=.*/org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8/' src/android/gradle.properties
          grep -q '^org.gradle.jvmargs=-Xmx5g ' src/android/gradle.properties
          {
            echo 'kotlin.compiler.execution.strategy=in-process'
            echo 'org.gradle.workers.max=2'
            echo 'org.gradle.parallel=false'
          } >> src/android/gradle.properties

      - name: Prefetch Robolectric native runtime with Maven Central fallback
        shell: bash
        run: |
          set -euo pipefail
          # GitHub-hosted runners sometimes receive HTTP 429 from Maven Central.
          # Download only the pinned dependency; never skip Android unit tests.
          REL='org/robolectric/nativeruntime-dist-compat/1.0.19'
          DEST="$HOME/.m2/repository/$REL"
          mkdir -p "$DEST"
          for extension in pom jar; do
            file="nativeruntime-dist-compat-1.0.19.$extension"
            success=false
            for attempt in 1 2 3 4; do
              for base in 'https://repo.maven.apache.org/maven2' 'https://repo1.maven.org/maven2'; do
                if curl --fail --location --silent --show-error \
                    --connect-timeout 15 --max-time 120 \
                    --output "$DEST/$file.tmp" "$base/$REL/$file"; then
                  test -s "$DEST/$file.tmp"
                  mv "$DEST/$file.tmp" "$DEST/$file"
                  success=true
                  break
                fi
                rm -f "$DEST/$file.tmp"
              done
              if [ "$success" = true ]; then break; fi
              echo "::warning::Maven download failed for $file (attempt $attempt/4); backing off"
              sleep $((attempt * 30))
            done
            if [ "$success" != true ]; then
              echo "::error::Robolectric dependency unavailable after retries; Android tests remain required"
              exit 1
            fi
          done
          echo 'ALTIV: pinned Robolectric native runtime cached locally.'

      - name: Run ALTIV MCP, Supabase scope and localhost unit tests
        working-directory: src/android
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :app:testAltivDebugUnitTest \
            --tests 'com.openminis.app.mcp.MCPQuickConnectCatalogTest' \
            --tests 'com.openminis.app.mcp.SupabaseMcpProjectScopeTest' \
            --tests 'com.openminis.app.ui.terminal.LocalPreviewAddressTest' \
            --tests 'com.openminis.app.ui.settings.AltivModelHealthProbeTest' \
            --tests 'com.openminis.app.ui.settings.AltivBatchModelSelectionTest' \
            --tests 'com.openminis.app.data.model.ApiProviderTemplateTest' \
            --tests 'com.openminis.app.data.model.AltivOnlineCostPolicyTest' \
            --tests 'com.openminis.app.offline.AltivOfflineModelCatalogTest' \
            --tests 'com.openminis.app.offline.AltivOfflineConversationPromptTest' \
            --tests 'com.openminis.app.provider.OpenAIProviderTest' \
            --tests 'com.openminis.app.provider.openai.OpenAIFamilyGatesTest' \
            --tests 'com.openminis.app.data.repository.AltivProfessionalSkillRoutingTest' \
            --tests 'com.openminis.app.data.repository.AltivBundledSkillsTest' \
            --tests 'com.openminis.app.ui.settings.AltivBrandingConsistencyTest' \
            --tests 'com.openminis.app.ui.settings.AltivFullBrandingTest' \
            --tests 'com.openminis.app.ui.settings.AltivCustomerFacingBrandTest' \
            --tests 'com.openminis.app.ui.chat.AltivToolBrandingTest' \
            --tests 'com.openminis.app.ui.chat.AltivPrematureWorkContinuationTest' \
            --tests 'com.openminis.app.data.repository.AltivProjectMemoryTest' \
            --tests 'com.openminis.app.tools.AltivMemoryToolContractTest' \
            --tests 'com.openminis.app.commercial.AltivSubscriptionPolicyTest' \
            --tests 'com.openminis.app.mcp.AltivGitHubPatConfigTest' \
            --tests 'com.openminis.app.mcp.AltivGitHubRepositoryAccessTest' \
            --tests 'com.openminis.app.mcp.AltivGitHubProjectInspectorTest' \
            --tests 'com.openminis.app.ui.settings.AltivCustomerSettingsPolicyTest' \
            --tests 'com.openminis.app.data.repository.AltivSkillBundleArchiveTest' \
            --tests 'com.openminis.app.agent.AgentTurnToolBudgetTest' \
            --tests 'com.openminis.app.ui.chat.AltivVisualBuilderTest' \
            --tests 'com.openminis.app.ui.chat.AltivRealPhotoPolicyTest' \
            --tests 'com.openminis.app.ui.chat.AltivSemanticDirectorPolicyTest' \
            --tests 'com.openminis.app.ui.chat.AltivBusinessIntentPreflightTest' \
            --tests 'com.openminis.app.ui.chat.AltivAutonomousSupervisorPolicyTest' \
            --tests 'com.openminis.app.browser.AltivVisualAuditTest' \
            --tests 'com.openminis.app.commercial.AltivLicenseActivationContractTest' \
            --tests 'com.openminis.app.mcp.SupabaseMcpAccountScopeTest'; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'ALTIV: Android unit tests failed after 3 attempts.' >&2
              exit 1
            fi
            echo "ALTIV: transient Gradle/Maven failure; retry $attempt/3 after backoff." >&2
            sleep $((attempt * 45))
          done

      - name: Version APK independently of ephemeral CI checkouts
        shell: bash
        run: |
          set -euo pipefail
          echo "ALTIV_ANDROID_VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Prepare optional permanent signing key (trusted main only)
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ALTIV_SIGNING_KEYSTORE_B64: ${{ secrets.ALTIV_SIGNING_KEYSTORE_B64 }}
          ALTIV_SIGNING_STORE_PASSWORD: ${{ secrets.ALTIV_SIGNING_STORE_PASSWORD }}
          ALTIV_SIGNING_KEY_ALIAS: ${{ secrets.ALTIV_SIGNING_KEY_ALIAS }}
          ALTIV_SIGNING_KEY_PASSWORD: ${{ secrets.ALTIV_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ALTIV_SIGNING_KEYSTORE_B64}" ]]; then
            echo "::warning::No persistent signing key configured; this debug APK will not install over builds signed by other keys."
          else
            : "${ALTIV_SIGNING_STORE_PASSWORD:?Set ALTIV_SIGNING_STORE_PASSWORD GitHub secret}"
            : "${ALTIV_SIGNING_KEY_ALIAS:?Set ALTIV_SIGNING_KEY_ALIAS GitHub secret}"
            : "${ALTIV_SIGNING_KEY_PASSWORD:?Set ALTIV_SIGNING_KEY_PASSWORD GitHub secret}"
            umask 077
            printf '%s' "$ALTIV_SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/altiv-signing.jks"
            echo "ALTIV_SIGNING_STORE_FILE=$RUNNER_TEMP/altiv-signing.jks" >> "$GITHUB_ENV"
            echo "::notice::Using persistent ALTIV signer from protected GitHub secret."
          fi

      - name: Compile dedicated ALTIV DEV AI Android ARM64 APK
        working-directory: src/android
        shell: bash
        # Public Supabase project URL and publishable key only. Same Supabase
        # Auth project as the ALTIV DEV Web Master panel.
        # NEVER include service_role or sb_secret_ keys in APK builds.
        env:
          ALTIV_COMMERCIAL_URL: ${{ secrets.ALTIV_COMMERCIAL_URL }}
          ALTIV_COMMERCIAL_PUBLISHABLE_KEY: ${{ secrets.ALTIV_COMMERCIAL_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleAltivDebug

      - name: Verify APK contains executable Linux sandbox and ARM64 runtime
        shell: bash
        run: |
          set -euo pipefail
          APK='src/android/app/build/outputs/apk/altiv/debug/app-altiv-debug.apk'
          test -s "$APK"
          # App identity must not collide with the installed Minis APK.
          BADGING="$("$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK")"
          grep -Fq "package: name='online.altiv.devai'" <<< "$BADGING"
          grep -Fq "application-label:'ALTIV DEV AI'" <<< "$BADGING"
          grep -Fq "versionCode='${ALTIV_ANDROID_VERSION_CODE}'" <<< "$BADGING"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/altiv-signature.txt"
          grep -i 'Signer #1 certificate SHA-256 digest' "$RUNNER_TEMP/altiv-signature.txt"
          # Certificate SHA-256 is public identity; never upload a private keystore.
          cp "$RUNNER_TEMP/altiv-signature.txt" "$APK.signature.txt"
          unzip -Z1 "$APK" > "$RUNNER_TEMP/apk-files.txt"
          # The publisher must be packaged into the actual installable APK,
          # not merely present in the source tree during compilation.
          unzip -Z1 "$APK" | grep -Fxq 'assets/default_mount/usr/local/bin/altiv-github-upload.py' || {
            echo '::error::GitHub binary publisher missing from APK assets'
            exit 1
          }
          # Android asset packaging can auto-decompress a .tar.gz file to .tar.
          # RootfsManager.kt supports both formats at runtime; verify both
          # acceptable names and the actual archive contents.
          for required in \
            'assets/proot-aarch64' \
            'lib/arm64-v8a/libproot.so' \
            'lib/arm64-v8a/libproot-loader.so' \
            'lib/arm64-v8a/libproot-loader32.so'; do
            if ! grep -Fxq "$required" "$RUNNER_TEMP/apk-files.txt"; then
              echo "::error::Missing sandbox APK entry: $required"
              exit 1
            fi
          done
          if grep -Fxq 'assets/alpine-minirootfs.tar.gz' "$RUNNER_TEMP/apk-files.txt"; then
            ROOTFS_ENTRY='assets/alpine-minirootfs.tar.gz'
            unzip -p "$APK" "$ROOTFS_ENTRY" | tar -tzf - > "$RUNNER_TEMP/altiv-rootfs-contents.txt"
          elif grep -Fxq 'assets/alpine-minirootfs.tar' "$RUNNER_TEMP/apk-files.txt"; then
            ROOTFS_ENTRY='assets/alpine-minirootfs.tar'
            unzip -p "$APK" "$ROOTFS_ENTRY" | tar -tf - > "$RUNNER_TEMP/altiv-rootfs-contents.txt"
          else
            echo '::error::Missing Alpine rootfs: expected .tar.gz or .tar APK asset'
            grep -E '^assets/.*(alpine|rootfs)' "$RUNNER_TEMP/apk-files.txt" || true
            exit 1
          fi
          # Green Android build without executable toolchain must fail.
          for required_bin in node npm npx python3 git bash rg; do
            if ! grep -Eq "(^|/)(usr/bin|bin)/${required_bin}$" "$RUNNER_TEMP/altiv-rootfs-contents.txt"; then
              echo "::error::Toolchain executable missing in final APK: $required_bin"
              exit 1
            fi
          done
          grep -Eq '(^|/)usr/local/bin/altiv-dev-check$' "$RUNNER_TEMP/altiv-rootfs-contents.txt" || {
            echo '::error::ALTIV environment checker missing from final APK'
            exit 1
          }
          grep -Fxq 'assets/default_mount/usr/local/bin/altiv-workspace.py' "$RUNNER_TEMP/apk-files.txt" || {
            echo '::error::ALTIV workspace helper missing from final APK'
            exit 1
          }
          echo "Verified Alpine rootfs and core programming tools in APK: $ROOTFS_ENTRY"
          sha256sum "$APK" > "$APK.sha256"
          ls -lh "$APK" "$APK.sha256"

      - name: Publish downloadable debug APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: altiv-dev-ai-independent-arm64-${{ github.run_number }}
          path: |
            src/android/app/build/outputs/apk/altiv/debug/app-altiv-debug.apk
            src/android/app/build/outputs/apk/altiv/debug/app-altiv-debug.apk.sha256
            src/android/app/build/outputs/apk/altiv/debug/app-altiv-debug.apk.signature.txt
          if-no-files-found: error
          retention-days: 14
