# Android ARM64 APK for review and manual testing.
# Build prerequisites are specified in BUILDING.md; never commit native binaries.
name: ALTIV - Android ARM64 APK

on:
  pull_request:
    paths:
      - '.github/workflows/altiv-android-arm64.yml'
      - 'src/android/**'
      - 'deps/**'
      - 'scripts/prepare_android_sandbox.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: altiv-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Compile and verify ARM64 debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout with the native PRoot submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Go 1.25 for gomobile / rclone
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Configure Android command line SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36, NDK r28c and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358' \
            'cmake;3.22.1'
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          NDK="$SDK_ROOT/ndk/28.2.13676358"
          test -d "$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

      - name: Build Android PRoot from its source; verify preserved Termux loaders
        shell: bash
        run: |
          set -euo pipefail
          ./deps/build_proot.sh
          ./scripts/prepare_android_sandbox.sh

      - name: Build rclone Android library with gomobile
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/rclone.aar
          test -s src/android/app/libs/rclone.aar

      - name: Run MCP quick-connect unit tests
        working-directory: src/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.openminis.app.mcp.MCPQuickConnectCatalogTest'

      - name: Compile Android ARM64 debug APK
        working-directory: src/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK contains executable Linux sandbox and ARM64 runtime
        shell: bash
        run: |
          set -euo pipefail
          APK='src/android/app/build/outputs/apk/github/debug/app-github-debug.apk'
          test -s "$APK"
          unzip -Z1 "$APK" > "$RUNNER_TEMP/apk-files.txt"
          for required in \
            'assets/proot-aarch64' \
            'assets/alpine-minirootfs.tar.gz' \
            'lib/arm64-v8a/libproot.so' \
            'lib/arm64-v8a/libproot-loader.so' \
            'lib/arm64-v8a/libproot-loader32.so'; do
            if ! grep -Fxq "$required" "$RUNNER_TEMP/apk-files.txt"; then
              echo "::error::Missing sandbox APK entry: $required"
              exit 1
            fi
          done
          sha256sum "$APK" > "$APK.sha256"
          ls -lh "$APK" "$APK.sha256"

      - name: Publish downloadable debug APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: altiv-openminis-arm64-debug-${{ github.run_number }}
          path: |
            src/android/app/build/outputs/apk/github/debug/app-github-debug.apk
            src/android/app/build/outputs/apk/github/debug/app-github-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
